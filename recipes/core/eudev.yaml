inherit: [autotools, init]

metaEnvironment:
    PKG_VERSION: "3.2.14"
    PKG_LICENSE: "GPL-2.0+, LGPL-2.1+"

depends:
    - name: devel::gperf
      use: [tools]
      tools:
          target-toolchain: host-compat-toolchain

checkoutSCM:
    scm: url
    url: ${GITHUB_MIRROR}/eudev-project/eudev/releases/download/v${PKG_VERSION}/eudev-${PKG_VERSION}.tar.gz
    digestSHA1: 242801bd31ff45a3fdc4a3b9d078ffa69ccae3c9
    stripComponents: 1

buildTools: [gperf]

Config:
    CORE_EUDEV_ENABLE_RULE_GEN:
        type: bool
        default: false
        help: |
            Enable eudev rule generator. (default: disabled)
    CORE_EUDEV_KMOD:
        help: Enable kmod support
        type: bool
        default: True

multiPackage:
    "":
        depends:
            # depend on our self for the host build; we want to create the
            # actual hw db
            - name: core::eudev-tools
              tools:
                  target-toolchain: host-compat-toolchain
              use: [tools]

            - name: kernel::kmod-lib-dev
              if: ${CORE_EUDEV_KMOD}

            - use: []
              depends:
                  - name: kernel::kmod-lib-tgt
                    if: ${CORE_EUDEV_KMOD}

        buildTools: [udevadm]
        buildVars:  [CORE_EUDEV_ENABLE_RULE_GEN, CORE_EUDEV_KMOD]
        buildScript: |
            autotoolsBuild $1 \
                --sbindir=/usr/sbin \
                --libexecdir=/lib \
                --disable-manpages \
                --disable-selinux \
                $(
                    [[ ${CORE_EUDEV_ENABLE_RULE_GEN} == 1 ]] &&
                        echo "-enable-rule-generator" ||
                        echo "-disable-rule-generator"
                ) \
                --disable-blkid \
                $([[ ${CORE_EUDEV_KMOD} == 1 ]] && echo "--enable-kmod" ||: ) \
                --enable-hwdb

            # update hw db for target build
            udevadm hwdb --update --root $PWD/install

            # and remove the source files, as they are not needed anymore
            rm -rf $PWD/install/etc/udev/hwdb.d

            # add init script
            if initIsAnySysvinit; then
                install -D -m 0755 $<@eudev/S10udev.sh@> install/etc/init.d/S10udev.sh
            fi

        multiPackage:
            "":
                depends:
                    - name: virtual::core::udev-tgt
                      use: []
                packageScript: autotoolsPackageBin
                provideDeps: [ "*-tgt" ]

            dev:
                packageScript: autotoolsPackageDev
                provideDeps: [ "*-dev" ]

            tgt:
                packageScript: autotoolsPackageLib
                provideDeps: [ "*-tgt" ]

    tools:
        buildScript: |
            # only enable hwdb management
            autotoolsBuild $1 \
                --sbindir=/usr/sbin \
                --libexecdir=/lib \
                --disable-manpages \
                --disable-selinux \
                --disable-blkid \
                --disable-rule-generator \
                --disable-kmod \
                --enable-hwdb

        packageScript: autotoolsPackageBin
        provideTools:
            udevadm: "usr/bin"

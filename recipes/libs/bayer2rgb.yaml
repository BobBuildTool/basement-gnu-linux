inherit: [autotools, autoconf]

metaEnvironment:
    PKG_LICENSE: "GPLv3"
    PKG_VERSION: "0.6.0"

checkoutSCM:
    scm: git
    url: https://gitlab-ext.sigma-chemnitz.de/ensc/bayer2rgb.git
    tag: v${PKG_VERSION}
    commit: dc5cda706fea679fc53597e03dd39dd17ebd8a2e

checkoutDeterministic: True
checkoutScript: |
    autoconfReconfigure

depends:
    - tools:
          target-toolchain: host-compat-toolchain
      name: devel::gengetopt
      use: [tools]

buildTools: [gengetopt]
buildScript: |
    autotoolsBuild $1

multiPackage:
    dev:
        packageScript: autotoolsPackageDev
    tgt:
        packageScript: autotoolsPackageTgt

inherit: [meson]

metaEnvironment:
    PKG_VERSION: "1.32.0"
    PKG_LICENSE: "GPL-2.0-only AND LGPL-2.1-only"

checkoutSCM:
    scm: git
    url: git://linuxtv.org/v4l-utils.git
    tag: "v4l-utils-${PKG_VERSION}"
    commit: 5a666c7ce89c00d66aa8e53c8f098a0c6c401f91

buildTools: [gettext, perl]
buildScript: |
    mesonBuild $1 \
       -Dv4l2-ctl-libv4l=false \
       -Dv4l2-compliance-libv4l=false \
       -Dv4l2-ctl-stream-to=false \
       -Dgconv=disabled

packageScript: mesonPackageTgt

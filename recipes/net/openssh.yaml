inherit: [autotools]

metaEnvironment:
    PKG_VERSION: "10.6p2"
    PKG_LICENSE: "LicenseRef-openssh"
    PKG_LICENSE_PATH: openssh:LICENCE

depends:
    - libs::libxcrypt-dev
    - libs::openssl-dev
    - libs::zlib-dev

    - use: []
      depends:
          - libs::libxcrypt-tgt
          - libs::openssl-tgt
          - libs::zlib-tgt

checkoutSCM:
    scm: url
    url: http://ftp.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-${PKG_VERSION}.tar.gz
    digestSHA256: 9ae44872090cf2f06b3cf9ff147e7f16f309671340763ed2f99248398ae29d5b
    stripComponents: 1

buildTools: [target-toolchain]
buildScript: |
    autotoolsBuild $1 \
        --sysconfdir=/etc/ssh \
        --disable-strip \
        --with-ssl-dir="${BOB_DEP_PATHS[libs::openssl-dev]}/usr" \
        --without-openssl-header-check

    mkdir -p install/.bob

    # add some daemon users
    cat >install/.bob/sshd.user-table <<EOF
    sshd -1 sshd -1 * - - - sshd user
    EOF

packageScript: |
    autotoolsPackageTgt

provideDeps: [ "*-tgt" ]

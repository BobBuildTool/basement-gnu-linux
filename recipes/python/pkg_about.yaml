inherit: ["python3::build"]

metaEnvironment:
    PKG_VERSION: "2.4.4"
    PKG_LICENSE: "Zlib"

checkoutSCM:
    scm: url
    url: ${GITHUB_MIRROR}/karpierz/pkg_about/archive/refs/tags/${PKG_VERSION}.tar.gz
    digestSHA256: e7668dd319cf1927832fd20e06d6226fdf8454d2a0ac80feb7576c6693e979b2
    stripComponents: 1

depends:
    - python::tox
    - python::pluggy
    - python::python3-setuptools
    - python::packaging
    - python::typing_extensions

buildScript: |
    python3Build $1

packageScript: |
    python3PackageTgt

provideDeps:
    - python::tox
    - python::pluggy
    - python::packaging
    - python::typing_extensions

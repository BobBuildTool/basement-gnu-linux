inherit: ["python3::build"]

metaEnvironment:
    PKG_VERSION: "2.4.4"
    PKG_LICENSE: "MIT"

checkoutSCM:
    scm: url
    url: ${GITHUB_MIRROR}/karpierz/pyc_wheel/archive/refs/tags/${PKG_VERSION}.tar.gz
    digestSHA256: 54b840fe9d77bb4c60f2af7992f12195e26ad1da687f51c92d4eb7c8dee32549
    stripComponents: 1

depends:
    - python::tox
    - python::python3-setuptools
    - python::typing_extensions
    - python::pkg_about

buildScript: |
    python3Build $1

packageScript: |
    python3PackageTgt

provideDeps: [ '*setuptools', '*typing_extensions', '*pkg_about' ]

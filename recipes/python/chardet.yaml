inherit: ["python3::build"]

metaEnvironment:
    PKG_VERSION: "5.2.0"
    PKG_LICENSE: "LGPL-2.1"

checkoutSCM:
    scm: url
    url: ${GITHUB_MIRROR}/chardet/chardet/archive/refs/tags/${PKG_VERSION}.tar.gz
    digestSHA256: a93d730fd5cf7ba9a543bd8e0a66a1f63a784bbb325bcb8c797ac91b56cdc9e2
    stripComponents: 1

depends:
    - python::hatchling
    - python::setuptools-scm
    - python::hatch-vcs

buildScript: |
    python3Build $1

packageScript: |
    python3PackageTgt

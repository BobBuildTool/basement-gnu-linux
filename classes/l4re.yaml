# Generic recipe for building l4re.
#
# Use it like this in your own recipes:
#
# inherit: [l4re]
#
# depends:
#     # add additional dependencies here, like linux kernels or external
#     # device trees
#     - fiasco
#
# checkoutSCM:
#     # our configuration:
#     - scm: import
#       url: src/l4re
#       dir: conf
#
#     # l4re repositories we want to use
#     - scm: git
#       url: ${GITHUB_MIRROR}/kernkonzept/mk.git
#       dir: l4re
#     - scm: git
#       url: ${GITHUB_MIRROR}/kernkonzept/bootstrap.git
#       dir: l4re/pkg/bootstrap
#     - ...
#
# buildSetup: |
#     # Add additional paths to dependencies here:
#     export MODULE_SEARCH_PATH+=:$1/conf
# buildScript: |
#        l4reBuild $1/l4re \
#           $1/conf/defconfig_l4re \
#           pkg/bootstrap pkg/... ...
#
#        l4reBuildImage $1/l4re \
#           uimage \
#           demo \
#           $1/conf/modules.list
#
# packageScript: |
#        l4reInstall $1 \
#           bootstrap.uimage
#
# To assemble the image in a separate recipe with l4image (see l4re::dist),
# install everything the image needs instead:
#
# packageScript: |
#        l4reInstallDist $1
#
# Dependencies using the tools of such a package get the l4image tool.

inherit: [pkg-config, make]

depends:
    - tools:
          target-toolchain: host-compat-toolchain
      depends:
          - name: devel::dtc
            use: [tools]
          - name: bsp::uboot-tools
            use: [tools]

buildTools: [host-toolchain, target-toolchain, m4, flex, bison, perl, dtc, uboot-tools]
buildVars: [CROSS_COMPILE]
buildSetup: |
    # Add all dependencies to the l4re module search path
    MODULE_SEARCH_PATH=""
    for i in "$@" ; do
        MODULE_SEARCH_PATH+=":$i"
    done
    export MODULE_SEARCH_PATH

    # $1: source dir
    # $2: defconfig
    # $3: targets (optional)
    l4reBuild()
    {
        if [[ ! -e build/.bob-init-done || "$2" -nt build/.kconfig ]] ; then
            rm -rf $BOB_CWD/build
            make -C $1 B=$BOB_CWD/build \
                DEFCONFIG="$2"
            make -C $1 O=$BOB_CWD/build \
                olddefconfig
            touch build/.bob-init-done
        fi

        makeParallel -C $1 O=$BOB_CWD/build \
            ${3:-}

        # l4reInstallDist has no access to the source dir
        mkdir -p $BOB_CWD/tool/bin $BOB_CWD/tool/lib
        cp $1/tool/bin/l4image $BOB_CWD/tool/bin/
        rsync -a --delete $1/tool/lib/L4 $BOB_CWD/tool/lib/
    }

    # $1: source dir
    # $2: image type
    # $3: modules entry
    # $4: modules list
    l4reBuildImage()
    {
        # we may want to replace this with l4image in a separate step
        makeParallel -C $1 O=$BOB_CWD/build \
            "$2" \
            E="$3" \
            MODULES_LIST="$4" \
            MODULE_SEARCH_PATH="$MODULE_SEARCH_PATH"
    }

packageSetup: |
    # $1: build dir
    # $2+: image name(s)
    l4reInstall()
    {
        for i in ${@:2}; do
            cp -L "$1/build/images/$i" .
        done
    }

    # Install the parts of the build dir that l4image takes the modules from
    # (see the search path of l4reDistImage in l4re::dist) and the l4image
    # tool.
    #
    # $1: build dir
    l4reInstallDist()
    {
        rsync -a --copy-unsafe-links \
            --include="/assets/***" \
            --include="/bin/" \
            --exclude="/bin/host/" \
            --exclude="/bin/targetsys/" \
            --include="/bin/*/" \
            --include="/bin/*/l4f/***" \
            --include="/bin/*/plain/***" \
            --include="/lib/" \
            --exclude="/lib/host/" \
            --include="/lib/*/" \
            --include="/lib/*/std/" \
            --include="/lib/*/std/l4f/" \
            --include="/lib/*/std/l4f/*.so*" \
            --exclude="*" \
            "$1/build/" .

        rsync -a "$1/tool" .
    }

provideTools:
    l4image:
        path: tool/bin
        dependTools: [perl]
